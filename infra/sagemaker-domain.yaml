AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SageMaker infrastructure for sg-finetune project.
  Creates Domain, User Profile, Space with JupyterLab, Pipeline, and Model Registry.
  Designed for educational use - students can access notebooks and run ML pipelines.

# =============================================================================
# Parameters
# =============================================================================
Parameters:
  ProjectName:
    Type: String
    Default: sg-finetune
    Description: Project name used for resource naming

  DomainName:
    Type: String
    Default: sg-finetune-domain
    Description: Name for the SageMaker Domain

  UserProfileName:
    Type: String
    Default: default-user
    Description: Name for the SageMaker User Profile

  SpaceName:
    Type: String
    Default: ml-workspace
    Description: Name for the SageMaker Space (JupyterLab environment)

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for SageMaker Domain

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for SageMaker Domain (at least one required)

  TrainingInstanceType:
    Type: String
    Default: ml.g4dn.xlarge
    Description: Instance type for training jobs

  NotebookInstanceType:
    Type: String
    Default: ml.t3.medium
    Description: Instance type for JupyterLab notebooks
    AllowedValues:
      - ml.t3.medium
      - ml.t3.large
      - ml.m5.large
      - ml.m5.xlarge

# =============================================================================
# Resources
# =============================================================================
Resources:

  # ---------------------------------------------------------------------------
  # S3 Bucket for artifacts
  # ---------------------------------------------------------------------------
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # IAM Role for SageMaker Execution
  # ---------------------------------------------------------------------------
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-sagemaker-execution-role'
      Description: Execution role for SageMaker Domain and training jobs
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub 'arn:aws:s3:::${ProjectName}-${AWS::AccountId}-${AWS::Region}'
                  - !Sub 'arn:aws:s3:::${ProjectName}-${AWS::AccountId}-${AWS::Region}/*'
                  - !Sub 'arn:aws:s3:::sagemaker-${AWS::Region}-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::sagemaker-${AWS::Region}-${AWS::AccountId}/*'
        - PolicyName: ECRAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: '*'
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/*'
        - PolicyName: EndpointManagementPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sagemaker:CreateModel
                  - sagemaker:DeleteModel
                  - sagemaker:DescribeModel
                  - sagemaker:CreateEndpointConfig
                  - sagemaker:DeleteEndpointConfig
                  - sagemaker:DescribeEndpointConfig
                  - sagemaker:CreateEndpoint
                  - sagemaker:DeleteEndpoint
                  - sagemaker:DescribeEndpoint
                  - sagemaker:UpdateEndpoint
                  - sagemaker:InvokeEndpoint
                  - sagemaker:InvokeEndpointAsync
                Resource:
                  - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:model/*'
                  - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint-config/*'
                  - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # SageMaker Domain
  # ---------------------------------------------------------------------------
  SageMakerDomain:
    Type: AWS::SageMaker::Domain
    DependsOn:
      - SageMakerExecutionRole
    Properties:
      DomainName: !Ref DomainName
      AuthMode: IAM
      VpcId: !Ref VpcId
      SubnetIds: !Ref SubnetIds
      AppNetworkAccessType: PublicInternetOnly
      DefaultUserSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
        JupyterServerAppSettings:
          DefaultResourceSpec:
            InstanceType: system
            SageMakerImageArn: !Sub 'arn:aws:sagemaker:${AWS::Region}:470317259841:image/jupyter-server-3'
        KernelGatewayAppSettings:
          DefaultResourceSpec:
            InstanceType: !Ref NotebookInstanceType
            SageMakerImageArn: !Sub 'arn:aws:sagemaker:${AWS::Region}:470317259841:image/sagemaker-distribution-cpu'
      DefaultSpaceSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
        JupyterLabAppSettings:
          DefaultResourceSpec:
            InstanceType: !Ref NotebookInstanceType
            SageMakerImageArn: !Sub 'arn:aws:sagemaker:${AWS::Region}:470317259841:image/sagemaker-distribution-cpu'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # SageMaker User Profile
  # ---------------------------------------------------------------------------
  SageMakerUserProfile:
    Type: AWS::SageMaker::UserProfile
    DependsOn:
      - SageMakerDomain
    Properties:
      DomainId: !Ref SageMakerDomain
      UserProfileName: !Ref UserProfileName
      UserSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # SageMaker Space (JupyterLab Workspace)
  # ---------------------------------------------------------------------------
  SageMakerSpace:
    Type: AWS::SageMaker::Space
    DependsOn:
      - SageMakerUserProfile
    Properties:
      DomainId: !Ref SageMakerDomain
      SpaceName: !Ref SpaceName
      SpaceDisplayName: ML Workspace
      SpaceSettings:
        AppType: JupyterLab
        JupyterLabAppSettings:
          DefaultResourceSpec:
            InstanceType: !Ref NotebookInstanceType
            SageMakerImageArn: !Sub 'arn:aws:sagemaker:${AWS::Region}:470317259841:image/sagemaker-distribution-cpu'
        SpaceStorageSettings:
          EbsStorageSettings:
            EbsVolumeSizeInGb: 10
      SpaceSharingSettings:
        SharingType: Private
      OwnershipSettings:
        OwnerUserProfileName: !Ref UserProfileName
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # Model Package Group (Model Registry)
  # ---------------------------------------------------------------------------
  ModelPackageGroup:
    Type: AWS::SageMaker::ModelPackageGroup
    Properties:
      ModelPackageGroupName: !Sub '${ProjectName}-models'
      ModelPackageGroupDescription: Model registry for sg-finetune fine-tuned models
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # SageMaker Pipeline Definition
  # ---------------------------------------------------------------------------
  SageMakerPipeline:
    Type: AWS::SageMaker::Pipeline
    DependsOn:
      - SageMakerExecutionRole
      - ModelPackageGroup
      - ArtifactsBucket
    Properties:
      PipelineName: !Sub '${ProjectName}-pipeline'
      PipelineDescription: Training pipeline for sg-finetune (Generate Data -> Train -> Register)
      RoleArn: !GetAtt SageMakerExecutionRole.Arn
      PipelineDefinition:
        PipelineDefinitionBody: !Sub |
          {
            "Version": "2020-12-01",
            "Parameters": [
              {"Name": "NumExamples", "Type": "String", "DefaultValue": "500"},
              {"Name": "TrainRatio", "Type": "String", "DefaultValue": "0.9"},
              {"Name": "ModelId", "Type": "String", "DefaultValue": "distilgpt2"},
              {"Name": "InstanceType", "Type": "String", "DefaultValue": "${TrainingInstanceType}"},
              {"Name": "Epochs", "Type": "String", "DefaultValue": "5"},
              {"Name": "BatchSize", "Type": "String", "DefaultValue": "8"},
              {"Name": "LearningRate", "Type": "String", "DefaultValue": "2e-5"},
              {"Name": "MaxLength", "Type": "String", "DefaultValue": "128"},
              {"Name": "ModelApprovalStatus", "Type": "String", "DefaultValue": "PendingManualApproval"}
            ],
            "Steps": [
              {
                "Name": "GenerateDataset",
                "Type": "Processing",
                "Arguments": {
                  "ProcessingResources": {
                    "ClusterConfig": {
                      "InstanceCount": 1,
                      "InstanceType": "ml.t3.medium",
                      "VolumeSizeInGB": 10
                    }
                  },
                  "AppSpecification": {
                    "ImageUri": "763104351884.dkr.ecr.${AWS::Region}.amazonaws.com/pytorch-training:2.1.0-cpu-py310-ubuntu20.04-sagemaker",
                    "ContainerEntrypoint": ["python3", "/opt/ml/processing/input/code/preprocess.py"]
                  },
                  "ProcessingInputs": [
                    {
                      "InputName": "code",
                      "S3Input": {
                        "S3Uri": "s3://${ProjectName}-${AWS::AccountId}-${AWS::Region}/${ProjectName}/pipeline/code/preprocess.py",
                        "LocalPath": "/opt/ml/processing/input/code",
                        "S3DataType": "S3Prefix",
                        "S3InputMode": "File"
                      }
                    }
                  ],
                  "ProcessingOutputConfig": {
                    "Outputs": [
                      {
                        "OutputName": "dataset",
                        "S3Output": {
                          "S3Uri": "s3://${ProjectName}-${AWS::AccountId}-${AWS::Region}/${ProjectName}/pipeline/data",
                          "LocalPath": "/opt/ml/processing/output",
                          "S3UploadMode": "EndOfJob"
                        }
                      }
                    ]
                  },
                  "RoleArn": "${SageMakerExecutionRole.Arn}",
                  "Environment": {
                    "NUM_EXAMPLES": {"Get": "Parameters.NumExamples"},
                    "TRAIN_RATIO": {"Get": "Parameters.TrainRatio"}
                  }
                }
              },
              {
                "Name": "TrainModel",
                "Type": "Training",
                "DependsOn": ["GenerateDataset"],
                "Arguments": {
                  "AlgorithmSpecification": {
                    "TrainingImage": "763104351884.dkr.ecr.${AWS::Region}.amazonaws.com/huggingface-pytorch-training:2.1.0-transformers4.36.0-gpu-py310-cu121-ubuntu20.04",
                    "TrainingInputMode": "File"
                  },
                  "ResourceConfig": {
                    "InstanceCount": 1,
                    "InstanceType": {"Get": "Parameters.InstanceType"},
                    "VolumeSizeInGB": 50
                  },
                  "StoppingCondition": {
                    "MaxRuntimeInSeconds": 7200
                  },
                  "HyperParameters": {
                    "model_id": {"Get": "Parameters.ModelId"},
                    "epochs": {"Get": "Parameters.Epochs"},
                    "batch_size": {"Get": "Parameters.BatchSize"},
                    "learning_rate": {"Get": "Parameters.LearningRate"},
                    "max_length": {"Get": "Parameters.MaxLength"},
                    "sagemaker_program": "train.py",
                    "sagemaker_submit_directory": "s3://${ProjectName}-${AWS::AccountId}-${AWS::Region}/${ProjectName}/pipeline/code/src.tar.gz"
                  },
                  "InputDataConfig": [
                    {
                      "ChannelName": "training",
                      "DataSource": {
                        "S3DataSource": {
                          "S3DataType": "S3Prefix",
                          "S3Uri": "s3://${ProjectName}-${AWS::AccountId}-${AWS::Region}/${ProjectName}/pipeline/data",
                          "S3DataDistributionType": "FullyReplicated"
                        }
                      }
                    }
                  ],
                  "OutputDataConfig": {
                    "S3OutputPath": "s3://${ProjectName}-${AWS::AccountId}-${AWS::Region}/${ProjectName}/pipeline/models"
                  },
                  "RoleArn": "${SageMakerExecutionRole.Arn}"
                }
              },
              {
                "Name": "RegisterModel",
                "Type": "RegisterModel",
                "DependsOn": ["TrainModel"],
                "Arguments": {
                  "ModelPackageGroupName": "${ProjectName}-models",
                  "ModelApprovalStatus": {"Get": "Parameters.ModelApprovalStatus"},
                  "InferenceSpecification": {
                    "Containers": [
                      {
                        "Image": "763104351884.dkr.ecr.${AWS::Region}.amazonaws.com/huggingface-pytorch-inference:2.1.0-transformers4.37.0-cpu-py310-ubuntu22.04",
                        "ModelDataUrl": {"Get": "Steps.TrainModel.ModelArtifacts.S3ModelArtifacts"}
                      }
                    ],
                    "SupportedContentTypes": ["application/json"],
                    "SupportedResponseMIMETypes": ["application/json"]
                  }
                }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation

# =============================================================================
# Outputs
# =============================================================================
Outputs:
  DomainId:
    Description: SageMaker Domain ID
    Value: !Ref SageMakerDomain
    Export:
      Name: !Sub '${ProjectName}-domain-id'

  DomainUrl:
    Description: SageMaker Domain URL
    Value: !GetAtt SageMakerDomain.Url
    Export:
      Name: !Sub '${ProjectName}-domain-url'

  UserProfileArn:
    Description: User Profile ARN
    Value: !GetAtt SageMakerUserProfile.UserProfileArn
    Export:
      Name: !Sub '${ProjectName}-user-profile-arn'

  SpaceArn:
    Description: SageMaker Space ARN (JupyterLab workspace)
    Value: !GetAtt SageMakerSpace.SpaceArn
    Export:
      Name: !Sub '${ProjectName}-space-arn'

  ExecutionRoleArn:
    Description: SageMaker Execution Role ARN
    Value: !GetAtt SageMakerExecutionRole.Arn
    Export:
      Name: !Sub '${ProjectName}-execution-role-arn'

  S3BucketName:
    Description: S3 Bucket for training data and models
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub '${ProjectName}-s3-bucket'

  ModelPackageGroupArn:
    Description: Model Package Group ARN
    Value: !GetAtt ModelPackageGroup.ModelPackageGroupArn
    Export:
      Name: !Sub '${ProjectName}-model-package-group-arn'

  PipelineArn:
    Description: Pipeline ARN
    Value: !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:pipeline/${ProjectName}-pipeline'
    Export:
      Name: !Sub '${ProjectName}-pipeline-arn'

  StudioUrl:
    Description: URL to access SageMaker Studio
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/sagemaker/home?region=${AWS::Region}#/studio/${SageMakerDomain}'

  JupyterLabUrl:
    Description: URL to launch JupyterLab Space
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/sagemaker/home?region=${AWS::Region}#/studio/${SageMakerDomain}/spaces/${SpaceName}'

  PipelineConsoleUrl:
    Description: URL to access Pipeline in console
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/sagemaker/home?region=${AWS::Region}#/pipelines/${ProjectName}-pipeline'

  NotebookLocation:
    Description: S3 location of the example notebook
    Value: !Sub 's3://${ProjectName}-${AWS::AccountId}-${AWS::Region}/${ProjectName}/notebooks/sg_finetune_pipeline.ipynb'

  QuickStartInstructions:
    Description: Quick start instructions for students
    Value: |
      1. Go to StudioUrl and click "Open Studio"
      2. Open the JupyterLab Space from the Spaces tab
      3. Download notebook from NotebookLocation or use: aws s3 cp <NotebookLocation> .
      4. Run the notebook cells to execute the ML pipeline
