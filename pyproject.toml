[project]
name = "sg-finetune"
version = "0.1.0"
description = "Fine-tune DistilGPT2 on SageMaker to learn Catalan greeting responses"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["sagemaker", "fine-tuning", "distilgpt2", "catalan", "huggingface"]

dependencies = [
    "boto3>=1.34.0",
    "sagemaker>=2.200.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "torch>=2.1.0",
    "accelerate>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
