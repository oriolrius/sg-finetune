name: Cleanup Resources

on:
  workflow_dispatch:
    inputs:
      delete_models:
        description: 'Delete model packages from registry'
        type: boolean
        default: false
      delete_s3:
        description: 'Delete S3 bucket and data'
        type: boolean
        default: false
      delete_iam:
        description: 'Delete IAM role stack'
        type: boolean
        default: false
      confirm:
        description: 'Type DESTROY to confirm'
        type: string
        required: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET: sg-finetune-${{ secrets.AWS_REGION }}

jobs:
  validate:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: ${{ inputs.confirm != 'DESTROY' }}
        run: |
          echo "ERROR: You must type 'DESTROY' to confirm deletion."
          echo "You entered: '${{ inputs.confirm }}'"
          exit 1

  cleanup:
    name: Cleanup Resources
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Delete model packages
        if: ${{ inputs.delete_models }}
        run: |
          echo "Deleting model packages from sg-finetune-distilgpt2..."

          # List and delete all model packages
          PACKAGES=$(aws sagemaker list-model-packages \
            --model-package-group-name sg-finetune-distilgpt2 \
            --query 'ModelPackageSummaryList[].ModelPackageArn' \
            --output text 2>/dev/null || echo "")

          if [ -n "$PACKAGES" ]; then
            for pkg in $PACKAGES; do
              echo "Deleting: $pkg"
              aws sagemaker delete-model-package --model-package-name "$pkg" || true
            done
          fi

          # Delete model package group
          echo "Deleting model package group..."
          aws sagemaker delete-model-package-group \
            --model-package-group-name sg-finetune-distilgpt2 2>/dev/null || true

          echo "Model packages deleted."

      - name: Stop running training jobs
        run: |
          echo "Checking for running training jobs..."

          JOBS=$(aws sagemaker list-training-jobs \
            --name-contains sg-finetune \
            --status-equals InProgress \
            --query 'TrainingJobSummaries[].TrainingJobName' \
            --output text 2>/dev/null || echo "")

          if [ -n "$JOBS" ]; then
            for job in $JOBS; do
              echo "Stopping: $job"
              aws sagemaker stop-training-job --training-job-name "$job" || true
            done
          else
            echo "No running training jobs found."
          fi

      - name: Delete S3 bucket
        if: ${{ inputs.delete_s3 }}
        run: |
          echo "Deleting S3 bucket: $S3_BUCKET"

          if aws s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
            aws s3 rb "s3://$S3_BUCKET" --force
            echo "S3 bucket deleted."
          else
            echo "S3 bucket does not exist."
          fi

      - name: Delete IAM role stack
        if: ${{ inputs.delete_iam }}
        run: |
          echo "Deleting IAM role CloudFormation stack..."

          if aws cloudformation describe-stacks --stack-name sg-finetune-iam 2>/dev/null; then
            aws cloudformation delete-stack --stack-name sg-finetune-iam
            aws cloudformation wait stack-delete-complete --stack-name sg-finetune-iam
            echo "IAM role stack deleted."
          else
            echo "IAM role stack does not exist."
          fi

      - name: Cleanup Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Cleanup Complete

          | Resource | Action |
          |----------|--------|
          | Model Packages | ${{ inputs.delete_models && 'Deleted' || 'Skipped' }} |
          | Running Jobs | Stopped (if any) |
          | S3 Bucket | ${{ inputs.delete_s3 && 'Deleted' || 'Skipped' }} |
          | IAM Role | ${{ inputs.delete_iam && 'Deleted' || 'Skipped' }} |

          **No further charges will be incurred for deleted resources.**
          EOF
